name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test,dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/frontend
      - run: pnpm lint
        working-directory: apps/frontend
      - run: pnpm format:check
        working-directory: apps/frontend
      - run: pnpm typecheck
        working-directory: apps/frontend
      - run: pnpm test
        working-directory: apps/frontend
      - run: pnpm build
        working-directory: apps/frontend
      # Regenerating from the committed openapi.json must reproduce generated.ts exactly, or the
      # backend's schema and the frontend's types have drifted.
      - run: pnpm gen:types && git diff --exit-code -- src/api/generated.ts
        working-directory: apps/frontend
